<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aroma Coffee House</title>
  <style>
    header {
      text-align: center;
      padding: 2rem 1rem;
      font-family: Georgia, 'Times New Roman', Times, serif;

      /* 3D effect */
      background: linear-gradient(145deg, #8b5e3c, #5c3b22);
      box-shadow:
        inset 0 4px 6px rgba(255, 255, 255, 0.25),
        inset 0 -6px 10px rgba(0, 0, 0, 0.4),
        0 8px 15px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      margin: 1rem;
    }

    header img {
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      color: #fdf6ec;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin: 0.5rem 0 0.2rem;
    }

    header h4 {
      color: #e3c9a8;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
      margin: 0;
      font-weight: normal;
    }

    /* ===== Coffee Menu table only ===== */
    table.menu-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 90%;
      max-width: 700px;
      margin: 2rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
      font-family: Georgia, 'Times New Roman', Times, serif;
    }

    .menu-table tr.menu-title th {
      background: linear-gradient(145deg, #8b5e3c, #5c3b22);
      color: #fdf6ec;
      font-size: 1.4rem;
      letter-spacing: 1px;
      padding: 1rem;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
    }

    .menu-table tr.menu-head th {
      background: #5c3b22;
      color: #e3c9a8;
      padding: 0.8rem;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .menu-table td {
      background: #fffaf3;
      color: #3b2615;
      padding: 0.9rem;
      border-bottom: 1px solid #e3c9a8;
      text-align: center;
      transition: background 0.2s ease;
    }

    .menu-table tr:nth-child(odd) td {
      background: #f7ecdd;
    }

    .menu-table tr:hover td {
      background: #ead3b5;
    }

    .menu-table td:last-child {
      font-weight: bold;
      color: #8b5e3c;
    }

    .menu-table img {
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 600px) {
      table.menu-table {
        width: 100%;
      }
      .menu-table th,
      .menu-table td {
        padding: 0.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body style="text-align: center; margin: 0; font-family: Georgia, 'Times New Roman', Times, serif;">

  <header>
    <img src="OIP.jpg" alt="logo" height="100">
    <h1>Aroma Coffee House</h1>
    <h4>Fresh Quality Drinks</h4>
  </header>

  <section>
    <h2>Our Premium Drinks</h2>
    <ul style="display: inline-block; text-align: left;">
      <li>Espresso Coffee</li>
      <li>Cappuccino Coffee</li>
      <li>Latte</li>
      <li>Mocha</li>
    </ul>
  </section>

  <section>
    <table class="menu-table">
      <tr class="menu-title">
        <th colspan="4">Coffee Menu</th>
      </tr>
      <tr class="menu-head">
        <th>Image</th>
        <th>Product</th>
        <th>Size</th>
        <th>Price</th>
      </tr>
      <tr>
        <td><img src="espresso.jpg" alt="Espresso" width="70" height="70"></td>
        <td>Espresso</td>
        <td>Small</td>
        <td>KES 150</td>
      </tr>
      <tr>
        <td><img src="cappuccino.jpg" alt="Cappuccino" width="70" height="70"></td>
        <td>Cappuccino</td>
        <td>Medium</td>
        <td>KES 250</td>
      </tr>
      <tr>
        <td><img src="latte.jpg" alt="Latte" width="70" height="70"></td>
        <td>Latte</td>
        <td>Medium</td>
        <td>KES 280</td>
      </tr>
      <tr>
        <td><img src="mocha.jpg" alt="Mocha" width="70" height="70"></td>
        <td>Mocha</td>
        <td>Large</td>
        <td>KES 320</td>
      </tr>
    </table>
  </section>
  <footer style="margin-top: 2rem; padding: 1rem; background-color: #5c3b22; color: #fdf6ec;">
    <p>&copy; 2026 Aroma Coffee House.</p>

</body>
</html>
